<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Relationsstruktur för Nordic Brew</title>
  <desc id="desc">Fyra relationer visas. Beställning har främmande nyckel till Kund. Orderrad har främmande nycklar till Beställning och Produkt. Pilarna går från främmande nycklar till refererade primärnycklar.</desc>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#173f5f"/></marker>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#173f5f}.h{font-size:30px;font-weight:700}.sh{font-size:21px;font-weight:700}.b{font-size:16px}.sm{font-size:14px}.card{fill:#fff;stroke:#173f5f;stroke-width:2.5;rx:14}.head{fill:#116466}.line{stroke:#173f5f;stroke-width:3;fill:none;marker-end:url(#arrow4)}</style>
  </defs>
  <rect width="1400" height="900" fill="#f7f9fb"/>
  <text class="t h" x="700" y="55" text-anchor="middle">Samband representeras med matchande nyckelvärden</text>

  <g transform="translate(80,130)">
    <rect class="card" width="420" height="240"/>
    <path class="head" d="M14 0 H406 Q420 0 420 14 V58 H0 V14 Q0 0 14 0"/>
    <text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">KUND</text>
    <g class="t b"><text x="24" y="94" font-weight="700">PK</text><text x="83" y="94">KundID</text><text x="24" y="130">AK</text><text x="83" y="130">Epost</text><text x="83" y="166">Namn</text></g>
    <text class="t sm" x="24" y="215">En rad per kund</text>
  </g>

  <g transform="translate(900,130)">
    <rect class="card" width="420" height="240"/>
    <path class="head" d="M14 0 H406 Q420 0 420 14 V58 H0 V14 Q0 0 14 0"/>
    <text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">PRODUKT</text>
    <g class="t b"><text x="24" y="94" font-weight="700">PK</text><text x="83" y="94">ProduktID</text><text x="83" y="130">Produktnamn</text><text x="83" y="166">ListprisOre</text><text x="83" y="202">Aktiv</text></g>
  </g>

  <g transform="translate(80,530)">
    <rect class="card" width="420" height="250"/>
    <path class="head" d="M14 0 H406 Q420 0 420 14 V58 H0 V14 Q0 0 14 0"/>
    <text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">BESTÄLLNING</text>
    <g class="t b"><text x="24" y="94" font-weight="700">PK</text><text x="83" y="94">OrderID</text><text x="24" y="130" font-weight="700">FK</text><text x="83" y="130">KundID</text><text x="83" y="166">Orderdatum</text><text x="83" y="202">Status</text></g>
  </g>

  <g transform="translate(900,530)">
    <rect class="card" width="420" height="250"/>
    <path class="head" d="M14 0 H406 Q420 0 420 14 V58 H0 V14 Q0 0 14 0"/>
    <text x="24" y="38" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">ORDERRAD</text>
    <g class="t b"><text x="24" y="94" font-weight="700">PK/FK</text><text x="100" y="94">OrderID</text><text x="24" y="130" font-weight="700">PK/FK</text><text x="100" y="130">ProduktID</text><text x="100" y="166">Antal</text><text x="100" y="202">AvtalatStyckprisOre</text></g>
  </g>

  <path class="line" d="M290 530 V380"/>
  <rect x="170" y="426" width="240" height="40" rx="10" fill="#f7f9fb"/>
  <text class="t sm" x="290" y="452" text-anchor="middle">KundID → KUND.KundID</text>

  <path class="line" d="M900 624 H510"/>
  <rect x="555" y="574" width="300" height="40" rx="10" fill="#f7f9fb"/>
  <text class="t sm" x="705" y="600" text-anchor="middle">OrderID → BESTÄLLNING.OrderID</text>

  <path class="line" d="M1110 530 V380"/>
  <rect x="990" y="426" width="240" height="40" rx="10" fill="#f7f9fb"/>
  <text class="t sm" x="1110" y="452" text-anchor="middle">ProduktID → PRODUKT.ProduktID</text>
  <text class="t sm" x="700" y="850" text-anchor="middle">Pilarna betyder logisk referens – inte fysisk pekare eller lagringsordning.</text>
</svg>
