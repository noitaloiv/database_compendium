<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc"><title id="title">En person kan ha två olika deltaganden</title><desc id="desc">Nora har PersonID 71. Enrollment har två rader, med kombinationerna 71 och 501 samt 71 och 608. De avser olika kurstillfällen, inte två personer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="435" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">En person kan ha två olika deltaganden</text><rect x="28" y="95" width="290" height="122" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Person</text><text x="44" y="161" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">PersonID: 71</text><text x="44" y="190" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">PersonName: Nora</text><rect x="510" y="85" width="360" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="526" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Deltagande på hösten</text><text x="526" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">PersonID: 71</text><text x="526" y="180" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">OfferingID: 501</text><rect x="510" y="260" width="360" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="526" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Deltagande på våren</text><text x="526" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">PersonID: 71</text><text x="526" y="355" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">OfferingID: 608</text><path d="M318 155 H410 V135 H495" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M410 155 V310 H495" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="417" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Identifieraren för deltagandet behöver både person och tillfälle.</text></svg>