<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Från värden till information</title>
  <desc id="desc">Tre steg visar råa värden, värden med rubriker och en tolkad mening med belopp i kronor.</desc>
  <style>
    .h{font:700 24px Arial,sans-serif;fill:#173f5f}.t{font:20px Arial,sans-serif;fill:#243447}.s{font:17px Arial,sans-serif;fill:#52606d}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.accent{fill:#e7f5f3;stroke:#116466;stroke-width:2}.arrow{stroke:#116466;stroke-width:3;fill:none}
  </style>
  <rect width="960" height="430" rx="24" fill="#f5f8fb"/>
  <text x="48" y="54" class="h">Från lagrade värden till begriplig information</text>
  <rect x="48" y="100" width="240" height="180" rx="16" class="box"/>
  <text x="168" y="139" class="s" text-anchor="middle">1 · värden</text>
  <text x="168" y="205" class="t" text-anchor="middle">1042</text>
  <text x="168" y="235" class="t" text-anchor="middle">2027-01-15</text>
  <text x="168" y="265" class="t" text-anchor="middle">34700</text>
  <path d="M305 190h44" class="arrow"/><path d="m340 180 12 10-12 10" class="arrow"/>
  <rect x="368" y="100" width="240" height="180" rx="16" class="box"/>
  <text x="488" y="139" class="s" text-anchor="middle">2 · rubriker och enhet</text>
  <text x="385" y="188" class="s">OrderID</text><text x="595" y="188" class="t" text-anchor="end">1042</text>
  <text x="385" y="226" class="s">OrderDate</text><text x="595" y="226" class="t" text-anchor="end">2027-01-15</text>
  <text x="385" y="264" class="s">TotalOre</text><text x="595" y="264" class="t" text-anchor="end">34700</text>
  <path d="M625 190h44" class="arrow"/><path d="m660 180 12 10-12 10" class="arrow"/>
  <rect x="688" y="100" width="224" height="180" rx="16" class="accent"/>
  <text x="800" y="139" class="s" text-anchor="middle">3 · tolkning</text>
  <text x="800" y="184" class="t" text-anchor="middle">Order 1042</text>
  <text x="800" y="217" class="t" text-anchor="middle">registrerades</text>
  <text x="800" y="250" class="t" text-anchor="middle">15 januari 2027</text>
  <text x="480" y="345" class="h" text-anchor="middle">Belopp: 347 kronor</text>
  <text x="480" y="382" class="s" text-anchor="middle">Värdena är desamma; sammanhanget gör dem tolkningsbara.</text>
</svg>
