<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="710" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc"><title id="title">Många-till-många och en mellanliggande relation</title><desc id="desc">En konceptuell association mellan STUDENT och COURSE_OFFERING tillåter noll eller flera i båda riktningarna. I relationsschemat hänvisar Enrollment till Student och CourseOffering. Kombinationen StudentID och OfferingID är en primärnyckel, medan RegisteredAt och Grade beskriver deltagandet.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.5"/></marker></defs><rect width="1100" height="710" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">A. Konceptuell modell: en student deltar i kurstillfällen</text><rect x="30" y="70" width="330" height="122" rx="10" fill="white" stroke="#7b94a2"/><path d="M30,115 H360" stroke="#7b94a2"/><text x="46" y="99" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">STUDENT</text><text x="46" y="143" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">ID StudentID</text><text x="46" y="175" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">StudentName</text><rect x="740" y="70" width="330" height="154" rx="10" fill="white" stroke="#7b94a2"/><path d="M740,115 H1070" stroke="#7b94a2"/><text x="756" y="99" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">COURSE_OFFERING</text><text x="756" y="143" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">ID OfferingID</text><text x="756" y="175" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">CourseCode</text><text x="756" y="207" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Semester</text><path d="M360,130 L740,130" fill="none" stroke="#146c72" stroke-width="2.5"/><text x="375" y="113" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">0..*</text><text x="725" y="113" fill="#172d3e" font-size="20" text-anchor="end" font-weight="400">0..*</text><text x="550" y="160" fill="#172d3e" font-size="20" text-anchor="middle" font-weight="400">participates in</text><text x="30" y="267" fill="#172d3e" font-size="19" text-anchor="start" font-weight="400">Deltagandet behöver också RegisteredAt och Grade.</text><text x="30" y="330" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">B. Relationsschema: varje deltagande blir en rad i Enrollment</text><rect x="30" y="385" width="280" height="122" rx="10" fill="white" stroke="#7b94a2"/><path d="M30,430 H310" stroke="#7b94a2"/><text x="46" y="414" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">Student</text><text x="46" y="458" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK StudentID</text><text x="46" y="490" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">StudentName</text><rect x="410" y="385" width="280" height="186" rx="10" fill="white" stroke="#7b94a2"/><path d="M410,430 H690" stroke="#7b94a2"/><text x="426" y="414" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">Enrollment</text><text x="426" y="458" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK-del, FK StudentID</text><text x="426" y="490" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK-del, FK OfferingID</text><text x="426" y="522" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">RegisteredAt</text><text x="426" y="554" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Grade</text><rect x="790" y="385" width="280" height="154" rx="10" fill="white" stroke="#7b94a2"/><path d="M790,430 H1070" stroke="#7b94a2"/><text x="806" y="414" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">CourseOffering</text><text x="806" y="458" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK OfferingID</text><text x="806" y="490" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">CourseCode</text><text x="806" y="522" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Semester</text><path d="M410,460 L310,460" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690,493 L790,460" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="645" fill="#172d3e" font-size="19" text-anchor="start" font-weight="650">Enrollment har EN sammansatt primärnyckel: StudentID + OfferingID.</text><text x="30" y="679" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Varje del hänvisar samtidigt till respektive relation. En rad gäller ett bestämt par.</text></g></svg>