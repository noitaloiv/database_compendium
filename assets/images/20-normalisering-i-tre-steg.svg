<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">Normalisering av en platt orderrelation</title>
  <desc id="desc">En platt OrderReport delas först upp för att skilja orderraden från order och produkt. Därefter skiljs kundfakta från orderfakta, vilket ger Customer, SalesOrder, Product och OrderLine.</desc>
  <style>.h{font:700 25px Arial,sans-serif;fill:#173f5f}.step{font:700 17px Arial,sans-serif;fill:#116466}.name{font:700 20px Arial,sans-serif;fill:#173f5f}.t{font:17px Arial,sans-serif;fill:#243447}.s{font:17px Arial,sans-serif;fill:#52606d}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.accent{fill:#e7f5f3;stroke:#116466;stroke-width:2}.line{stroke:#116466;stroke-width:3;fill:none}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#116466"/></marker></defs>
  <rect width="1160" height="760" rx="24" fill="#f5f8fb"/>
  <text x="48" y="54" class="h">Låt varje relation beskriva ett sammanhållet slags faktum</text>
  <text x="55" y="105" class="step">UTGÅNGSLÄGE</text>
  <rect x="55" y="125" width="1050" height="100" rx="15" class="box"/><text x="580" y="165" class="name" text-anchor="middle">OrderReport</text><text x="580" y="198" class="t" text-anchor="middle">order · kund · produkt · orderrad i samma relation</text>
  <path d="M580 225v75" class="line" marker-end="url(#arrow)"/>
  <text x="600" y="276" class="step">AVLÄGSNA PARTIELLA BEROENDEN</text>
  <rect x="100" y="320" width="440" height="110" rx="15" class="box"/><text x="320" y="365" class="name" text-anchor="middle">Order + kundfakta</text><text x="320" y="397" class="s" text-anchor="middle">bestäms av OrderID</text>
  <rect x="620" y="320" width="440" height="110" rx="15" class="accent"/><text x="840" y="365" class="name" text-anchor="middle">Product · OrderLine</text><text x="840" y="397" class="s" text-anchor="middle">produkt respektive kombinationen order + produkt</text>
  <path d="M320 430v95M840 430v95" class="line" marker-end="url(#arrow)"/>
  <text x="580" y="492" class="step" text-anchor="middle">AVLÄGSNA TRANSITIVA BEROENDEN</text>
  <rect x="45" y="550" width="245" height="115" rx="15" class="accent"/><text x="168" y="600" class="name" text-anchor="middle">Customer</text><text x="168" y="632" class="s" text-anchor="middle">kundfakta</text>
  <rect x="320" y="550" width="245" height="115" rx="15" class="accent"/><text x="443" y="600" class="name" text-anchor="middle">SalesOrder</text><text x="443" y="632" class="s" text-anchor="middle">orderfakta</text>
  <rect x="595" y="550" width="245" height="115" rx="15" class="accent"/><text x="718" y="600" class="name" text-anchor="middle">Product</text><text x="718" y="632" class="s" text-anchor="middle">produktfakta</text>
  <rect x="870" y="550" width="245" height="115" rx="15" class="accent"/><text x="993" y="600" class="name" text-anchor="middle">OrderLine</text><text x="993" y="632" class="s" text-anchor="middle">order + produkt</text>
  <text x="580" y="714" class="s" text-anchor="middle">Nycklar och främmande nycklar gör att de separerade fakta kan kombineras när en fråga behöver dem.</text>
</svg>
