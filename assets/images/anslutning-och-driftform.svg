<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Program, anslutning och databashantering</title><desc id="desc">SQLite körs som bibliotek inne i ett program. Ett serverbaserat DBHS körs som separat tjänst. Båda alternativen låter programmet arbeta med data via SQL.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#23596a"/></marker></defs>
<rect width="1000" height="620" rx="12" fill="#f6f8fa"/>
<g font-family="Arial, sans-serif" fill="#172b35">
<text x="40" y="44" font-size="25" font-weight="bold">Samma frågor, olika driftformer</text>
<rect x="30" y="70" width="460" height="460" rx="10" fill="white" stroke="#9bb2bd"/>
<rect x="510" y="70" width="460" height="460" rx="10" fill="white" stroke="#9bb2bd"/>
<text x="55" y="106" font-size="21" font-weight="bold">Inbäddad databasmotor</text>
<text x="535" y="106" font-size="21" font-weight="bold">Separat databasserver</text>
<rect x="65" y="137" width="390" height="244" rx="8" fill="#edf4f6" stroke="#5b8392" stroke-dasharray="5 4"/>
<text x="83" y="163" font-size="16">Ett program</text>
<rect x="95" y="180" width="330" height="63" rx="6" fill="#dcecf1" stroke="#668c9b"/>
<text x="260" y="207" text-anchor="middle" font-size="19">Programkod</text><text x="260" y="229" text-anchor="middle" font-size="15">Väljer fråga och hanterar svaret</text>
<path d="M260 250V293" stroke="#23596a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="285" y="277" font-size="15">Anrop och resultat</text>
<rect x="95" y="302" width="330" height="56" rx="6" fill="#dcecf1" stroke="#668c9b"/><text x="260" y="336" text-anchor="middle" font-size="19">SQLite-bibliotek</text>
<path d="M260 389V436" stroke="#23596a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="95" y="447" width="330" height="55" rx="6" fill="#fff" stroke="#668c9b"/><text x="260" y="481" text-anchor="middle" font-size="19">Databasfil</text>
<rect x="565" y="180" width="350" height="63" rx="6" fill="#dcecf1" stroke="#668c9b"/><text x="740" y="207" text-anchor="middle" font-size="19">Applikation</text><text x="740" y="229" text-anchor="middle" font-size="15">Programkod och databibliotek</text>
<path d="M740 251V293" stroke="#23596a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="758" y="278" font-size="14">Anslutning</text>
<rect x="565" y="302" width="350" height="79" rx="6" fill="#dcecf1" stroke="#668c9b"/><text x="740" y="334" text-anchor="middle" font-size="19">Serverbaserat DBHS</text><text x="740" y="357" text-anchor="middle" font-size="15">Hanterar åtkomst och lagring</text>
<path d="M740 389V436" stroke="#23596a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="565" y="447" width="350" height="55" rx="6" fill="#fff" stroke="#668c9b"/><text x="740" y="481" text-anchor="middle" font-size="19">Databasens lagring</text>
<text x="40" y="568" font-size="17">Anslutning och driftform kan skilja sig.</text><text x="40" y="596" font-size="17">Betydelser, nycklar och verksamhetsregler behöver fortfarande vara genomtänkta.</text>
</g></svg>