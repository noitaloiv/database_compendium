<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img" aria-labelledby="title desc"><title id="title">Nattens kopia innehåller inte dagens nya order</title><desc id="desc">En kopia tas klockan 02. Nya korrekta order registreras 09, en felaktig radering godkänns 11 och upptäcks 14. Återställning från kopian kan undanröja felet men också sakna dagens korrekta arbete.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="475" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Nattens kopia innehåller inte dagens nya order</text><path d="M65 130 H830" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="65" cy="130" r="7" fill="#146c72"/><text x="65" y="105" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#173b50">02.00</text><circle cx="295" cy="130" r="7" fill="#146c72"/><text x="295" y="105" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#173b50">09.00</text><circle cx="525" cy="130" r="7" fill="#146c72"/><text x="525" y="105" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#173b50">11.00</text><circle cx="805" cy="130" r="7" fill="#146c72"/><text x="805" y="105" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#173b50">14.00</text><rect x="28" y="166" width="195" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Kopia</text><text x="44" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Nattens</text><text x="44" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">tillstånd</text><rect x="244" y="166" width="195" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="260" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Nya order</text><text x="260" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Korrekt arbete</text><text x="260" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">efter kopian</text><rect x="460" y="166" width="195" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="476" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Radering</text><text x="476" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Felaktig ändring</text><text x="476" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">godkänns</text><rect x="676" y="166" width="195" height="122" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="692" y="196" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Upptäckt</text><text x="692" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Vilket arbete</text><text x="692" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">ska bevaras?</text><rect x="28" y="365" width="844" height="75" rx="8" fill="#fff1e7" stroke="#7897a8" stroke-width="1.5"/><text x="45" y="395" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Återställning till 02.00 löser inte hela frågan:</text><text x="45" y="424" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">även de korrekta order som tillkom senare behöver hanteras.</text></svg>