<svg xmlns="http://www.w3.org/2000/svg" width="900" height="495" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">B:s läsvärde följer inte senare ändringar</title><desc id="desc">B hämtar 100. A skriver och godkänner 90, men B har fortfarande kopian 100 och beräknar 80. Om B skriver 80 ersätts effekten av A:s uttag.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="495" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">B:s läsvärde följer inte senare ändringar</text><rect x="28" y="85" width="330" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Databas vid B:s läsning</text><text x="44" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Godkänt saldo: 100</text><path d="M360 135 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="500" y="85" width="370" height="93" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="516" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">B:s lokala arbete</text><text x="516" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Läst värde: 100</text><path d="M190 187 V209 M190 238 V248" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="228" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">A tar ut 10 och gör COMMIT</text><rect x="28" y="268" width="330" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="298" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Databas efter A</text><text x="44" y="334" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Godkänt saldo: 90</text><rect x="500" y="268" width="370" height="93" rx="8" fill="#fff1e7" stroke="#7897a8" stroke-width="1.5"/><text x="516" y="298" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">B har kvar samma kopia</text><text x="516" y="334" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">100 − 20 = 80</text><path d="M680 187 V209 M680 238 V252" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="495" y="228" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Ingen automatisk omläsning</text><path d="M500 335 H375" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="420" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#173b50">Om B skriver 80 går A:s minskning förlorad.</text><text x="28" y="461" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Båda uttagen tillsammans skulle ge 100 − 10 − 20 = 70.</text></svg>