<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Begreppslig läsordning för SELECT</title>
  <desc id="desc">Fyra steg visar att en enkel SQL-fråga kan förstås genom FROM, WHERE, SELECT och ORDER BY, även om syntaxen skrivs i en annan ordning.</desc>
  <style>.h{font:700 24px Arial,sans-serif;fill:#173f5f}.sql{font:700 20px 'Courier New',monospace;fill:#116466}.t{font:20px Arial,sans-serif;fill:#243447}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.accent{fill:#e7f5f3;stroke:#116466;stroke-width:2}.line{stroke:#116466;stroke-width:3;fill:none}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#116466"/></marker></defs>
  <rect width="1040" height="390" rx="24" fill="#f5f8fb"/>
  <text x="48" y="54" class="h">En fråga skrivs i en ordning men kan förstås i en annan</text>
  <path d="M260 213h50M490 213h50M720 213h50" class="line" marker-end="url(#arrow)"/>
  <rect x="80" y="145" width="180" height="136" rx="16" class="accent"/><text x="170" y="195" class="sql" text-anchor="middle">FROM</text><text x="170" y="235" class="t" text-anchor="middle">välj utgångstabell</text>
  <rect x="310" y="145" width="180" height="136" rx="16" class="box"/><text x="400" y="195" class="sql" text-anchor="middle">WHERE</text><text x="400" y="235" class="t" text-anchor="middle">behåll rätt rader</text>
  <rect x="540" y="145" width="180" height="136" rx="16" class="box"/><text x="630" y="195" class="sql" text-anchor="middle">SELECT</text><text x="630" y="235" class="t" text-anchor="middle">forma kolumner</text>
  <rect x="770" y="145" width="190" height="136" rx="16" class="accent"/><text x="865" y="195" class="sql" text-anchor="middle">ORDER BY</text><text x="865" y="235" class="t" text-anchor="middle">ordna resultatet</text>
  <text x="520" y="340" font-family="Arial,sans-serif" font-size="14" fill="#52606d" text-anchor="middle">Modellen beskriver frågans innebörd, inte DBHS:ets fysiska exekveringsplan.</text>
</svg>
