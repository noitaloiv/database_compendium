<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Den första upplåsningen delar arbetet i två faser</title><desc id="desc">I den växande fasen får lås tas men inte släppas. Efter första upplåsningen får lås släppas men inga nya tas. COMMIT behöver inte sammanfalla med fasgränsen i grundläggande 2PL.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="360" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Den första upplåsningen delar arbetet i två faser</text><rect x="28" y="88" width="385" height="151" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Växande fas</text><text x="44" y="154" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Ta lås på X</text><text x="44" y="183" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Ta lås på Y</text><text x="44" y="212" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Inga lås släpps</text><rect x="487" y="88" width="385" height="151" rx="8" fill="#fff1e7" stroke="#7897a8" stroke-width="1.5"/><text x="503" y="118" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Krympande fas</text><text x="503" y="154" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Släpp lås på X</text><text x="503" y="183" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Släpp lås på Y</text><text x="503" y="212" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Inga nya lås tas</text><path d="M413 152 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="280" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#173b50">Första upplåsningen är gränsen</text><text x="28" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Illustration av 2PL. Striktare varianter knyter upplåsning till avslutet.</text></svg>