<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Två godkända tillstånd kan ge en missvisande blandning</title><desc id="desc">Före överföringen är saldona 1000 och 500, efter den 800 och 700. Rapporten hämtar 1000 från före och 700 från efter och får 1700 i stället för 1500.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="430" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Två godkända tillstånd kan ge en missvisande blandning</text><rect x="28" y="80" width="365" height="151" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Före överföringen</text><text x="44" y="146" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Konto 1: 1000</text><text x="44" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Konto 2: 500</text><text x="44" y="204" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Summa: 1500</text><rect x="507" y="80" width="365" height="151" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="523" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Efter COMMIT</text><text x="523" y="146" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Konto 1: 800</text><text x="523" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Konto 2: 700</text><text x="523" y="204" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Summa: 1500</text><path d="M130 240 V278 H285 V305" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 240 V278 H615 V305" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="215" y="325" width="470" height="93" rx="8" fill="#fff1e7" stroke="#7897a8" stroke-width="1.5"/><text x="231" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">A:s rapport</text><text x="231" y="391" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">1000 + 700 = 1700</text></svg>