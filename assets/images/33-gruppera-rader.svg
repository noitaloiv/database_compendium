<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Fyra orderrader blir tre produktgrupper</title><desc id="desc">Två rader med ProductID 501 ger summan 3. Produkt 502 ger 1 och produkt 503 ger 3. COUNT ger i stället 2, 1 och 1.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="500" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Fyra orderrader blir tre produktgrupper</text><rect x="28" y="90" width="330" height="200" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><path d="M28,130 h330" stroke="#7897a8"/><text x="40" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">OrderID</text><text x="150" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">ProductID</text><text x="265" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">Quantity</text><text x="40" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1042</text><text x="150" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">501</text><text x="265" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">2</text><text x="40" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1042</text><text x="150" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">502</text><text x="265" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1</text><text x="40" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1043</text><text x="150" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">501</text><text x="265" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1</text><text x="40" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1043</text><text x="150" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">503</text><text x="265" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">3</text><rect x="490" y="85" width="380" height="122" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="506" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Produkt 501</text><text x="506" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">2 + 1 = 3 förpackningar</text><text x="506" y="180" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">2 orderrader</text><rect x="490" y="215" width="380" height="122" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="506" y="245" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Produkt 502</text><text x="506" y="281" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">1 förpackning</text><text x="506" y="310" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">1 orderrad</text><rect x="490" y="345" width="380" height="122" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="506" y="375" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Produkt 503</text><text x="506" y="411" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">3 förpackningar</text><text x="506" y="440" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">1 orderrad</text><path d="M358 150 H408 V125 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 230 H423 V150 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 190 H395 V255 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M358 270 H380 V385 H480" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="28" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">GROUP BY ProductID</text><text x="28" y="399" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Samma produktnummer</text><text x="28" y="428" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">ger samma grupp.</text></svg>