<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Observationstid är inte importtid</title><desc id="desc">Lagret inventeras till nittio förpackningar klockan nio. Efter en utleverans av tio finns åttio kvar klockan femton. När den äldre rapporten importeras klockan femton anger den fortfarande nittio. Importen är ny, observationen är äldre.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.5"/></marker></defs><rect width="1000" height="510" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="37" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">En nyligen importerad uppgift kan beskriva ett äldre läge</text><text x="325" y="87" fill="#172d3e" font-size="20" text-anchor="middle" font-weight="650">kl. 09:00</text><text x="825" y="87" fill="#172d3e" font-size="20" text-anchor="middle" font-weight="650">kl. 15:00</text><text x="30" y="165" fill="#172d3e" font-size="21" text-anchor="start" font-weight="650">Lagret</text><rect x="210" y="115" width="230" height="105" rx="10" fill="#edf5f5" stroke="#7b94a2"/><text x="325" y="155" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">Inventering</text><text x="325" y="194" fill="#172d3e" font-size="23" text-anchor="middle" font-weight="650">90 förpackningar</text><rect x="710" y="115" width="230" height="105" rx="10" fill="#edf5f5" stroke="#7b94a2"/><text x="825" y="155" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">Efter utleverans</text><text x="825" y="194" fill="#172d3e" font-size="23" text-anchor="middle" font-weight="650">80 förpackningar</text><path d="M450,170 L700,170" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="575" y="149" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">10 skickas ut</text><text x="30" y="325" fill="#172d3e" font-size="21" text-anchor="start" font-weight="650">Rapporten</text><rect x="210" y="265" width="230" height="135" rx="10" fill="white" stroke="#7b94a2"/><text x="325" y="302" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">Observation sparas</text><text x="325" y="340" fill="#172d3e" font-size="23" text-anchor="middle" font-weight="650">saldo 90</text><text x="325" y="377" fill="#172d3e" font-size="16" text-anchor="middle" font-weight="400">ObservedAt 09:00</text><rect x="710" y="265" width="230" height="135" rx="10" fill="#fcf0dc" stroke="#7b94a2"/><text x="825" y="302" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">Samma fil importeras</text><text x="825" y="340" fill="#172d3e" font-size="23" text-anchor="middle" font-weight="650">saldo 90</text><text x="825" y="377" fill="#172d3e" font-size="16" text-anchor="middle" font-weight="400">ImportedAt 15:00</text><path d="M450,330 L700,330" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="575" y="310" fill="#172d3e" font-size="18" text-anchor="middle" font-weight="400">ingen ny mätning</text><text x="30" y="449" fill="#172d3e" font-size="18" text-anchor="start" font-weight="400">Rapporten kan beskriva klockan 09 korrekt, men räcker inte för dagens plockning kl. 15.</text><text x="30" y="482" fill="#172d3e" font-size="19" text-anchor="start" font-weight="650">Importtid och observationstid svarar på olika frågor.</text></g></svg>