<svg xmlns="http://www.w3.org/2000/svg" width="900" height="525" viewBox="0 0 900 525" role="img" aria-labelledby="title desc"><title id="title">En registrering, två möjliga avslut</title><desc id="desc">Från saldo 100 och ingen leverans ändras saldot till 90 och leverans 1001 med antal 10 läggs till. COMMIT bevarar båda ändringarna. ROLLBACK i stället återställer saldot 100 och tar bort leveransposten.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="525" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">En registrering, två möjliga avslut</text><rect x="240" y="75" width="420" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="256" y="105" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Före BEGIN</text><text x="256" y="141" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Saldo 100 · ingen leverans 1001</text><path d="M450 170 V205" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="200" y="225" width="500" height="122" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="216" y="255" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Inom samma transaktion</text><text x="216" y="291" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">UPDATE: saldo 90</text><text x="216" y="320" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">INSERT: leverans 1001, antal 10</text><path d="M300 348 V365 H225 V390" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 348 V365 H675 V390" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="28" y="410" width="395" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="440" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">COMMIT</text><text x="44" y="476" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Saldo 90 · leverans 1001 finns</text><rect x="477" y="410" width="395" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="493" y="440" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">ROLLBACK i stället</text><text x="493" y="476" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Saldo 100 · leverans 1001 saknas</text></svg>