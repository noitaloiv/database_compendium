<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Databasen som del av ett informationssystem</title>
  <desc id="desc">Människor och andra system använder ett presentationslager. Det anropar ett applikationslager som kommunicerar med ett DBMS. DBMS hanterar databasen. Verksamhetsregler och ansvar omger hela kedjan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#173f5f"/>
    </marker>
    <style>
      .t{font-family:Inter,Arial,sans-serif;fill:#173f5f}.h{font-size:30px;font-weight:700}.sh{font-size:22px;font-weight:700}.b{font-size:17px}.sm{font-size:15px}.box{stroke:#173f5f;stroke-width:2.5;rx:16}.line{stroke:#173f5f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#f7f9fb"/>
  <rect x="35" y="35" width="1130" height="610" rx="24" fill="none" stroke="#5b6470" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="t h" x="65" y="82">Informationssystem</text>
  <text class="t sm" x="65" y="111">människor · processer · regler · teknik</text>

  <rect class="box" x="80" y="205" width="190" height="150" fill="#e8f3f1"/>
  <text class="t sh" x="175" y="248" text-anchor="middle">Aktörer</text>
  <text class="t b" x="175" y="282" text-anchor="middle">kunder</text>
  <text class="t b" x="175" y="309" text-anchor="middle">medarbetare</text>
  <text class="t b" x="175" y="336" text-anchor="middle">andra system</text>

  <rect class="box" x="330" y="205" width="205" height="150" fill="#dceaf4"/>
  <text class="t sh" x="432" y="248" text-anchor="middle">Presentation</text>
  <text class="t b" x="432" y="284" text-anchor="middle">webb · app</text>
  <text class="t b" x="432" y="313" text-anchor="middle">rapport · formulär</text>

  <rect class="box" x="595" y="205" width="205" height="150" fill="#f7e7df"/>
  <text class="t sh" x="697" y="248" text-anchor="middle">Applikation</text>
  <text class="t b" x="697" y="284" text-anchor="middle">arbetsflöden</text>
  <text class="t b" x="697" y="313" text-anchor="middle">verksamhetslogik</text>

  <rect class="box" x="860" y="205" width="220" height="150" fill="#fff4cf"/>
  <text class="t sh" x="970" y="248" text-anchor="middle">DBMS</text>
  <text class="t b" x="970" y="284" text-anchor="middle">frågor · villkor</text>
  <text class="t b" x="970" y="313" text-anchor="middle">transaktioner</text>

  <path class="line" d="M270 280 H322"/>
  <path class="line" d="M535 280 H587"/>
  <path class="line" d="M800 280 H852"/>

  <ellipse cx="970" cy="480" rx="110" ry="32" fill="#d8eee8" stroke="#173f5f" stroke-width="2.5"/>
  <rect x="860" y="448" width="220" height="92" fill="#d8eee8" stroke="#173f5f" stroke-width="2.5"/>
  <ellipse cx="970" cy="540" rx="110" ry="32" fill="#d8eee8" stroke="#173f5f" stroke-width="2.5"/>
  <ellipse cx="970" cy="448" rx="110" ry="32" fill="#eef8f5" stroke="#173f5f" stroke-width="2.5"/>
  <text class="t sh" x="970" y="500" text-anchor="middle">Databas</text>
  <text class="t sm" x="970" y="526" text-anchor="middle">schema + data</text>
  <path class="line" d="M970 355 V408"/>

  <rect x="115" y="445" width="630" height="118" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="2"/>
  <text class="t sh" x="145" y="486">Ansvar följer hela kedjan</text>
  <text class="t b" x="145" y="520">betydelse · datakvalitet · behörighet · laglighet · återställning</text>
  <text class="t sm" x="145" y="548">En tekniskt giltig databas är inte automatiskt ett ändamålsenligt informationssystem.</text>
</svg>

