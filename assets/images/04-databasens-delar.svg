<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Klient, DBMS och databas</title>
  <desc id="desc">En användare arbetar i DB Browser. Klienten skickar SQL-frågor till SQLite som hanterar databasfilen Nordic Brew.</desc>
  <style>.h{font:700 24px Arial,sans-serif;fill:#173f5f}.t{font:18px Arial,sans-serif;fill:#243447}.s{font:14px Arial,sans-serif;fill:#52606d}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.accent{fill:#e7f5f3;stroke:#116466;stroke-width:2}.line{stroke:#116466;stroke-width:3;fill:none}</style>
  <rect width="1040" height="430" rx="24" fill="#f5f8fb"/>
  <text x="48" y="55" class="h">Tre olika delar på samma dator</text>
  <circle cx="100" cy="215" r="48" fill="#d9e2ec" stroke="#7b93a8" stroke-width="2"/><circle cx="100" cy="197" r="15" fill="#52606d"/><path d="M70 245c8-32 52-32 60 0" fill="#52606d"/><text x="100" y="293" class="s" text-anchor="middle">ANVÄNDARE</text>
  <rect x="210" y="128" width="220" height="174" rx="18" class="box"/><text x="320" y="170" class="s" text-anchor="middle">KLIENT</text><text x="320" y="210" class="t" text-anchor="middle">DB Browser</text><text x="320" y="244" class="s" text-anchor="middle">skriver och visar</text><text x="320" y="268" class="s" text-anchor="middle">SQL och resultat</text>
  <rect x="520" y="128" width="220" height="174" rx="18" class="accent"/><text x="630" y="170" class="s" text-anchor="middle">DBMS</text><text x="630" y="213" class="t" text-anchor="middle">SQLite</text><text x="630" y="247" class="s" text-anchor="middle">tolkar kommandon</text><text x="630" y="271" class="s" text-anchor="middle">och kontrollerar regler</text>
  <path d="M148 215h62M430 195h90M520 235h-90M740 215h80" class="line"/>
  <rect x="820" y="128" width="174" height="174" rx="40" class="box"/><ellipse cx="907" cy="160" rx="72" ry="22" fill="#d9e2ec" stroke="#7b93a8" stroke-width="2"/><text x="907" y="216" class="s" text-anchor="middle">DATABASFIL</text><text x="907" y="251" class="t" text-anchor="middle">Nordic Brew</text><text x="907" y="276" class="s" text-anchor="middle">struktur + data</text>
  <text x="475" y="370" class="s" text-anchor="middle">Fråga →</text><text x="475" y="394" class="s" text-anchor="middle">← Resultat</text>
</svg>
