<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Vad räcker för att bestämma uppgiften?</title><desc id="desc">ProductID bestämmer ProductName. OrderID bestämmer CustomerID, som bestämmer CustomerName. Kombinationen OrderID och ProductID bestämmer Quantity.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="470" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Vad räcker för att bestämma uppgiften?</text><rect x="28" y="80" width="245" height="93" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Produkt</text><text x="44" y="146" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">ProductID</text><path d="M273 125 H470" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="80" width="380" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="506" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Produktens namn</text><text x="506" y="146" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">ProductName</text><rect x="28" y="235" width="215" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Order</text><text x="44" y="301" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">OrderID</text><path d="M243 278 H308" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="235" width="245" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="344" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Kund på ordern</text><text x="344" y="301" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">CustomerID</text><path d="M573 278 H638" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="658" y="235" width="215" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="674" y="265" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Kundnamn</text><text x="674" y="301" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">CustomerName</text><text x="30" y="397" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">OrderID + ProductID</text><path d="M295 390 H490" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="397" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Quantity</text><text x="30" y="440" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">För antalet behövs både beställningen och produkten.</text></svg>