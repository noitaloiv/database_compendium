<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Giltiga värden kan beskriva fel händelse</title><desc id="desc">I ett separat illustrativt fall beställer Mira två kaffeförpackningar, men antalet registreras som tjugo. Kunden och produkten finns och tjugo är positivt, så främmande nycklar och ett positivt antal kan godkännas. Felet upptäcks genom jämförelse med beställningens underlag.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.5"/></marker></defs><rect width="1000" height="520" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="37" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">Samma order kan vara tekniskt giltig och ändå beskriva fel antal</text><rect x="30" y="72" width="405" height="270" rx="10" fill="#edf5f5" stroke="#7b94a2"/><text x="55" y="109" fill="#172d3e" font-size="21" text-anchor="start" font-weight="650">Miras beställningsunderlag</text><path d="M92,156 l12,-17 h75 l12,17 v112 h-99 Z" fill="#dfc6a2" stroke="#6f5638" stroke-width="2"/><rect x="104" y="180" width="75" height="55" rx="10" fill="#fffaf0" stroke="#6f5638"/><text x="141" y="203" fill="#172d3e" font-size="12" text-anchor="middle" font-weight="650">COFFEE</text><text x="141" y="223" fill="#172d3e" font-size="14" text-anchor="middle" font-weight="400">500 g</text><path d="M225,156 l12,-17 h75 l12,17 v112 h-99 Z" fill="#dfc6a2" stroke="#6f5638" stroke-width="2"/><rect x="237" y="180" width="75" height="55" rx="10" fill="#fffaf0" stroke="#6f5638"/><text x="274" y="203" fill="#172d3e" font-size="12" text-anchor="middle" font-weight="650">COFFEE</text><text x="274" y="223" fill="#172d3e" font-size="14" text-anchor="middle" font-weight="400">500 g</text><text x="55" y="312" fill="#172d3e" font-size="19" text-anchor="start" font-weight="650">2 förpackningar av produkt 501</text><rect x="565" y="72" width="405" height="270" rx="10" fill="white" stroke="#7b94a2"/><text x="590" y="109" fill="#172d3e" font-size="21" text-anchor="start" font-weight="650">Registreringen i systemet</text><text x="590" y="152" fill="#172d3e" font-size="18" text-anchor="start" font-weight="400">OrderID</text><text x="895" y="152" fill="#172d3e" font-size="21" text-anchor="end" font-weight="650">9001</text><text x="590" y="194" fill="#172d3e" font-size="18" text-anchor="start" font-weight="400">CustomerID</text><text x="895" y="194" fill="#172d3e" font-size="21" text-anchor="end" font-weight="650">17</text><text x="590" y="236" fill="#172d3e" font-size="18" text-anchor="start" font-weight="400">ProductID</text><text x="895" y="236" fill="#172d3e" font-size="21" text-anchor="end" font-weight="650">501</text><text x="590" y="278" fill="#172d3e" font-size="18" text-anchor="start" font-weight="400">Quantity</text><text x="895" y="278" fill="#172d3e" font-size="21" text-anchor="end" font-weight="650">20</text><path d="M435,205 L555,205" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="168" fill="#172d3e" font-size="16" text-anchor="middle" font-weight="400">inmatning</text><text x="500" y="251" fill="#172d3e" font-size="19" text-anchor="middle" font-weight="650">2 → 20</text><rect x="30" y="370" width="940" height="125" rx="10" fill="#fcf0dc" stroke="#7b94a2"/><text x="50" y="405" fill="#172d3e" font-size="19" text-anchor="start" font-weight="400">Reglerna kan godkänna raden: kunden och produkten finns, och 20 &gt; 0.</text><text x="50" y="440" fill="#172d3e" font-size="19" text-anchor="start" font-weight="400">För att upptäcka felskrivningen behöver vi jämföra med beställningsunderlaget.</text><text x="50" y="474" fill="#172d3e" font-size="17" text-anchor="start" font-weight="400">Ett godkänt villkor är alltså inte ett bevis på att registreringen återger händelsen.</text></g></svg>