<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Två villkor skyddar olika delar av prisregeln</title><desc id="desc">NULL stoppas av NOT NULL, minus 100 stoppas av CHECK, och noll tillåts eftersom gränsen är större än eller lika med noll.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="390" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Två villkor skyddar olika delar av prisregeln</text><rect x="28" y="90" width="835" height="160" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><path d="M28,130 h835" stroke="#7897a8"/><text x="40" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">Prisförsök</text><text x="180" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">NOT NULL</text><text x="380" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">CHECK (Price &gt;= 0)</text><text x="685" y="117" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">Resultat</text><text x="40" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">NULL</text><text x="180" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Avvisar</text><text x="380" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Okänt; avvisar inte</text><text x="685" y="157" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Avvisas</text><text x="40" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">−100</text><text x="180" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Godtar</text><text x="380" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Falskt; avvisar</text><text x="685" y="197" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Avvisas</text><rect x="29" y="210" width="833" height="40" fill="#ddf1e9"/><text x="40" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">0</text><text x="180" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Godtar</text><text x="380" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Sant; godtar</text><text x="685" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">Godtas</text><text x="28" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Ett angivet värde behöver fortfarande följa prisgränsen.</text><text x="28" y="345" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Price är ett kort namn för listpriset i just denna illustration.</text></svg>