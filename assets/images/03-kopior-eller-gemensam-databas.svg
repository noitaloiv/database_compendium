<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Separata filkopior jämfört med gemensam databas</title>
  <desc id="desc">Vänster sida visar tre filer med motstridiga adresser för kund 17. Höger sida visar tre arbetsuppgifter kopplade till en gemensam databas.</desc>
  <style>.h{font:700 24px Arial,sans-serif;fill:#173f5f}.t{font:17px Arial,sans-serif;fill:#243447}.s{font:14px Arial,sans-serif;fill:#52606d}.bad{fill:#fff3f3;stroke:#c53030;stroke-width:2}.good{fill:#e7f5f3;stroke:#116466;stroke-width:2}.neutral{fill:#fff;stroke:#9fb3c8;stroke-width:2}.line{stroke:#116466;stroke-width:3;fill:none}</style>
  <rect width="1040" height="500" rx="24" fill="#f5f8fb"/>
