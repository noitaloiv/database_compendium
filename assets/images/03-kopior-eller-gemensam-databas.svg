  <rect x="48" y="204" width="410" height="92" rx="14" class="bad"/><text x="72" y="238" class="s">ORDERFIL</text><text x="72" y="271" class="t">17 · mira.ek@example.test</text>
  <rect x="48" y="318" width="410" height="92" rx="14" class="bad"/><text x="72" y="352" class="s">ADRESSLISTA</text><text x="72" y="385" class="t">17 · mira@example.test</text>
