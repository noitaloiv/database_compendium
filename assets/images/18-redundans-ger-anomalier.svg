<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Redundans kan ge tre förändringsanomalier</title>
  <desc id="desc">Tre kort visar en uppdateringsanomali när samma produktnamn ändras olika, en insättningsanomali när en produkt kräver en orderrad och en raderingsanomali när kundfakta försvinner med den sista orderraden.</desc>
  <style>.h{font:700 25px Arial,sans-serif;fill:#173f5f}.name{font:700 18px Arial,sans-serif;fill:#173f5f}.t{font:16px Arial,sans-serif;fill:#243447}.bad{font:700 16px Arial,sans-serif;fill:#9b2c2c}.s{font:14px Arial,sans-serif;fill:#52606d}.card{fill:#fff;stroke:#9fb3c8;stroke-width:2}.warn{fill:#fde8e8;stroke:#c53030;stroke-width:2}.line{stroke:#c53030;stroke-width:3;fill:none}</style>
  <rect width="1160" height="720" rx="24" fill="#f5f8fb"/>
  <text x="48" y="54" class="h">När flera slags fakta delar rad uppstår förändringsproblem</text>
  <rect x="55" y="115" width="330" height="480" rx="18" class="card"/><text x="220" y="160" class="name" text-anchor="middle">UPPDATERINGSANOMALI</text><rect x="85" y="205" width="270" height="74" rx="12" class="warn"/><text x="220" y="237" class="t" text-anchor="middle">501 · Brew coffee</text><text x="220" y="264" class="s" text-anchor="middle">order 1042</text><rect x="85" y="305" width="270" height="74" rx="12" class="warn"/><text x="220" y="337" class="bad" text-anchor="middle">501 · Brew coffe</text><text x="220" y="364" class="s" text-anchor="middle">order 1043</text><text x="220" y="430" class="t" text-anchor="middle">Samma produktfaktum</text><text x="220" y="458" class="t" text-anchor="middle">har två värden.</text>
  <rect x="415" y="115" width="330" height="480" rx="18" class="card"/><text x="580" y="160" class="name" text-anchor="middle">INSÄTTNINGSANOMALI</text><rect x="455" y="220" width="250" height="105" rx="12" class="warn"/><text x="580" y="257" class="t" text-anchor="middle">Ny produkt</text><text x="580" y="286" class="bad" text-anchor="middle">men ingen OrderID?</text><text x="580" y="375" class="t" text-anchor="middle">Produktfaktumet kan inte</text><text x="580" y="403" class="t" text-anchor="middle">lagras utan ett orelaterat</text><text x="580" y="431" class="t" text-anchor="middle">orderfaktum.</text>
  <rect x="775" y="115" width="330" height="480" rx="18" class="card"/><text x="940" y="160" class="name" text-anchor="middle">RADERINGSANOMALI</text><rect x="815" y="220" width="250" height="105" rx="12" class="warn"/><text x="940" y="257" class="t" text-anchor="middle">Sista orderraden tas bort</text><path d="M850 285h180" class="line"/><text x="940" y="375" class="bad" text-anchor="middle">kundens enda uppgifter</text><text x="940" y="403" class="bad" text-anchor="middle">försvinner samtidigt</text>
  <text x="580" y="655" class="s" text-anchor="middle">Grundproblemet är att order-, kund- och produktfakta inte kan förändras oberoende av varandra.</text>
</svg>

