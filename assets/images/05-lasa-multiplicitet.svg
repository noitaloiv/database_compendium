<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">Så läses multiplicitet i en association</title>
  <desc id="desc">Entitetstypen Kund är förbunden med Beställning genom associationen gör. Vid kundänden står 1..1 och vid beställningsänden 0..*. Två frågor visar hur talen läses från motsatt entitet.</desc>
  <defs><style>.t{font-family:Inter,Arial,sans-serif;fill:#173f5f}.h{font-size:30px;font-weight:700}.sh{font-size:22px;font-weight:700}.b{font-size:17px}.sm{font-size:15px}.entity{fill:#fff;stroke:#173f5f;stroke-width:3;rx:16}.call{fill:#e8f3f1;stroke:#116466;stroke-width:2;rx:14}.line{stroke:#173f5f;stroke-width:4;fill:none}</style></defs>
  <rect width="1300" height="650" fill="#f7f9fb"/>
  <text class="t h" x="650" y="55" text-anchor="middle">Läs en associationsände i taget</text>

  <rect class="entity" x="95" y="215" width="280" height="130"/>
  <text class="t sh" x="235" y="290" text-anchor="middle">KUND</text>
  <rect class="entity" x="925" y="215" width="280" height="130"/>
  <text class="t sh" x="1065" y="290" text-anchor="middle">BESTÄLLNING</text>
  <line class="line" x1="375" y1="280" x2="925" y2="280"/>
  <rect x="575" y="247" width="150" height="66" rx="33" fill="#f7e7df" stroke="#173f5f" stroke-width="2"/>
  <text class="t b" x="650" y="286" text-anchor="middle" font-weight="700">gör</text>
  <text class="t sh" x="430" y="252">1..1</text>
  <text class="t sh" x="814" y="252">0..*</text>

  <rect class="call" x="80" y="415" width="500" height="125"/>
  <text class="t b" x="110" y="454" font-weight="700">Utgå från en BESTÄLLNING:</text>
  <text class="t b" x="110" y="488">Hur många KUNDER gör den?</text>
  <text class="t b" x="110" y="520">Svar: exakt en (1..1).</text>
  <path d="M470 415 C520 365 455 320 430 270" stroke="#116466" stroke-width="2.5" fill="none"/>

  <rect class="call" x="720" y="415" width="500" height="125"/>
  <text class="t b" x="750" y="454" font-weight="700">Utgå från en KUND:</text>
  <text class="t b" x="750" y="488">Hur många BESTÄLLNINGAR kan kunden göra?</text>
  <text class="t b" x="750" y="520">Svar: noll eller flera (0..*).</text>
  <path d="M830 415 C780 365 790 320 820 270" stroke="#116466" stroke-width="2.5" fill="none"/>
  <text class="t sm" x="650" y="610" text-anchor="middle">Talet nära en entitetstyp besvarar frågan som börjar från den andra entitetstypen.</text>
</svg>

