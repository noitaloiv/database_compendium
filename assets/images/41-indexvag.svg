<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Ett sökvärde kan leda till flera rader</title><desc id="desc">Sökningen CustomerID 17 hittar två hänvisningar genom indexet och når order 1042 och 1044. Order 1043 gäller en annan kund.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="410" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Ett sökvärde kan leda till flera rader</text><rect x="28" y="85" width="270" height="93" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Sökvärde</text><text x="44" y="151" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">CustomerID = 17</text><rect x="28" y="240" width="270" height="93" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Indexets idé</text><text x="44" y="306" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">17 → två hänvisningar</text><path d="M165 184 V223" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300 290 H410 V168 H490" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M410 290 V247 H490" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="510" y="100" width="355" height="160" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><path d="M510,140 h355" stroke="#7897a8"/><text x="522" y="127" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">OrderID</text><text x="697" y="127" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">CustomerID</text><rect x="511" y="140" width="353" height="40" fill="#ddf1e9"/><text x="522" y="167" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1042</text><text x="697" y="167" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">17</text><text x="522" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1043</text><text x="697" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">24</text><rect x="511" y="220" width="353" height="40" fill="#ddf1e9"/><text x="522" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1044</text><text x="697" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">17</text><text x="28" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Schematisk åtkomstväg, inte SQLite-systemets lagringsformat.</text></svg>