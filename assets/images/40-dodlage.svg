<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Ett dödläge är en cirkel av väntan</title><desc id="desc">A håller X och väntar på Y som B håller. B håller Y och väntar på X som A håller. Ingen når sitt avslut utan att väntcykeln bryts.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="460" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Ett dödläge är en cirkel av väntan</text><rect x="28" y="90" width="300" height="93" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5"/><text x="44" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Transaktion A</text><text x="44" y="156" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Håller X-lås på X</text><rect x="572" y="260" width="300" height="93" rx="8" fill="#fff1e7" stroke="#7897a8" stroke-width="1.5"/><text x="588" y="290" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Transaktion B</text><text x="588" y="326" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Håller X-lås på Y</text><path d="M330 137 H720 V243" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="448" y="110" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">A väntar på Y</text><path d="M570 312 H178 V199" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="282" y="352" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">B väntar på X</text><text x="28" y="418" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Låsen kan skydda uppgifterna samtidigt som arbetet står stilla.</text></svg>