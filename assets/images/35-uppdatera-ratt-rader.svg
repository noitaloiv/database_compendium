<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">Samma villkor före och efter förändringen</title><desc id="desc">Tre aktiva produkter får priset höjt med 100 öre. Den inaktiva produkten 504 har kvar priset 14900.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6"/></marker></defs><rect width="900" height="425" rx="12" fill="#f5f8fb"/><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Samma villkor före och efter förändringen</text><text x="28" y="88" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">WHERE Active = 1</text><text x="490" y="88" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">ListPriceOre + 100</text><rect x="28" y="110" width="345" height="200" rx="8" fill="#fff" stroke="#7897a8" stroke-width="1.5"/><path d="M28,150 h345" stroke="#7897a8"/><text x="40" y="137" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">ProductID</text><text x="150" y="137" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">Active</text><text x="260" y="137" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#173b50">Pris före</text><rect x="29" y="150" width="343" height="40" fill="#ddf1e9"/><text x="40" y="177" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">501</text><text x="150" y="177" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#173b50">1</text><text x="260" y="177" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1