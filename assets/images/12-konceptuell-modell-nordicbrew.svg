<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-labelledby="title desc">
  <title id="title">Konceptuell modell för Nordic Brew</title>
  <desc id="desc">CUSTOMER places SALES_ORDER, SALES_ORDER contains ORDER_LINE och ORDER_LINE refers to PRODUCT. Min- och maxmultiplicitet visas vid alla associationsändar.</desc>
  <style>.h{font:700 23px Arial,sans-serif;fill:#173f5f}.t{font:20px Arial,sans-serif;fill:#243447}.s{font:17px Arial,sans-serif;fill:#52606d}.head{fill:#173f5f}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.line{stroke:#116466;stroke-width:3}.verb{font:italic 17px Arial,sans-serif;fill:#116466}.mult{font:700 20px Arial,sans-serif;fill:#116466}.note{fill:#e7f5f3;stroke:#116466;stroke-width:2}</style>
  <rect width="1160" height="700" rx="24" fill="#f5f8fb"/>
  <text x="48" y="52" class="h">Nordic Brew · konceptuell ordermodell</text>
  <g transform="translate(55 110)"><rect width="235" height="180" rx="14" class="box"/><rect width="235" height="52" rx="14" class="head"/><rect y="38" width="235" height="14" class="head"/><text x="18" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">CUSTOMER</text><text x="18" y="86" class="s">ID · CustomerID</text><text x="18" y="120" class="t">CustomerName</text><text x="18" y="151" class="t">Email</text></g>
  <g transform="translate(465 110)"><rect width="235" height="180" rx="14" class="box"/><rect width="235" height="52" rx="14" class="head"/><rect y="38" width="235" height="14" class="head"/><text x="18" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">SALES_ORDER</text><text x="18" y="86" class="s">ID · OrderID</text><text x="18" y="120" class="t">OrderDate</text><text x="18" y="151" class="t">Status</text></g>
  <g transform="translate(465 440)"><rect width="235" height="180" rx="14" class="box"/><rect width="235" height="52" rx="14" class="head"/><rect y="38" width="235" height="14" class="head"/><text x="18" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">ORDER_LINE</text><text x="18" y="86" class="s">ID · Order + Product</text><text x="18" y="120" class="t">Quantity</text><text x="18" y="151" class="t">AgreedUnitPriceOre</text></g>
  <g transform="translate(870 440)"><rect width="235" height="180" rx="14" class="box"/><rect width="235" height="52" rx="14" class="head"/><rect y="38" width="235" height="14" class="head"/><text x="18" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">PRODUCT</text><text x="18" y="86" class="s">ID · ProductID</text><text x="18" y="120" class="t">ProductName</text><text x="18" y="151" class="t">ListPriceOre</text></g>
  <line x1="290" y1="200" x2="465" y2="200" class="line"/><text x="378" y="181" class="verb" text-anchor="middle">places</text><text x="310" y="230" class="mult">1..1</text><text x="414" y="230" class="mult">0..*</text>
  <line x1="583" y1="290" x2="583" y2="440" class="line"/><text x="610" y="369" class="verb">contains</text><text x="602" y="320" class="mult">1..1</text><text x="602" y="428" class="mult">0..*</text>
  <line x1="700" y1="530" x2="870" y2="530" class="line"/><text x="785" y="511" class="verb" text-anchor="middle">refers to</text><text x="720" y="560" class="mult">0..*</text><text x="820" y="560" class="mult">1..1</text>
  <rect x="55" y="440" width="300" height="180" rx="16" class="note"/><text x="80" y="478" class="s">LÄS SOM MENINGAR</text><text x="80" y="518" class="t">Varje order görs av exakt</text><text x="80" y="547" class="t">en kund.</text><text x="80" y="584" class="t">En produkt kan finnas utan</text><text x="80" y="613" class="t">att ha beställts.</text>
  <text x="580" y="668" class="s" text-anchor="middle">ID avser verksamhetsidentifierare. PK och FK införs först i tabellmodellen.</text>
</svg>
