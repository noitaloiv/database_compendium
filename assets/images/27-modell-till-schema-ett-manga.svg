<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Från en-till-många-modell till relationsschema</title><desc id="desc">Överst har CUSTOMER identifieraren CustomerID och SALES_ORDER identifieraren OrderID. Associationen places har 1..1 vid kunden och 0..* vid ordern. Nederst blir identifierarna primärnycklar och SalesOrder får obligatorisk främmande nyckel CustomerID som hänvisar till Customer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.5"/></marker></defs><rect width="1000" height="610" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="35" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">A. Konceptuell modell: vem gör beställningen?</text><rect x="30" y="65" width="360" height="154" rx="10" fill="white" stroke="#7b94a2"/><path d="M30,110 H390" stroke="#7b94a2"/><text x="46" y="94" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">CUSTOMER</text><text x="46" y="138" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">ID CustomerID</text><text x="46" y="170" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">CustomerName</text><text x="46" y="202" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Email</text><rect x="610" y="65" width="360" height="154" rx="10" fill="white" stroke="#7b94a2"/><path d="M610,110 H970" stroke="#7b94a2"/><text x="626" y="94" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">SALES_ORDER</text><text x="626" y="138" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">ID OrderID</text><text x="626" y="170" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">OrderDate</text><text x="626" y="202" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Status</text><path d="M390,133 L610,133" fill="none" stroke="#146c72" stroke-width="2.5"/><text x="405" y="116" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">1..1</text><text x="592" y="116" fill="#172d3e" font-size="20" text-anchor="end" font-weight="400">0..*</text><text x="500" y="161" fill="#172d3e" font-size="20" text-anchor="middle" font-weight="400">places</text><text x="30" y="269" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">En kund kan sakna order. Varje order behöver däremot en kund.</text><text x="30" y="330" fill="#172d3e" font-size="23" text-anchor="start" font-weight="650">B. Relationsschema: beställningen får en kundhänvisning</text><rect x="30" y="360" width="360" height="154" rx="10" fill="white" stroke="#7b94a2"/><path d="M30,405 H390" stroke="#7b94a2"/><text x="46" y="389" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">Customer</text><text x="46" y="433" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK CustomerID</text><text x="46" y="465" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">CustomerName</text><text x="46" y="497" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Email</text><rect x="610" y="360" width="360" height="186" rx="10" fill="white" stroke="#7b94a2"/><path d="M610,405 H970" stroke="#7b94a2"/><text x="626" y="389" fill="#173b50" font-size="20" text-anchor="start" font-weight="650">SalesOrder</text><text x="626" y="433" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">PK OrderID</text><text x="626" y="465" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">OrderDate</text><text x="626" y="497" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">Status</text><text x="626" y="529" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">FK CustomerID · obligatorisk</text><path d="M610,520 L390,433" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="500" y="425" fill="#172d3e" font-size="20" text-anchor="middle" font-weight="400">hänvisar till</text><text x="30" y="580" fill="#172d3e" font-size="20" text-anchor="start" font-weight="400">CustomerID får upprepas i SalesOrder: flera order kan peka på samma kund.</text></g></svg>