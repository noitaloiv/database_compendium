<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Förlorad uppdatering av lagersaldo</title>
  <desc id="desc">Transaktion A och B läser båda saldot 20. A skriver 18 efter ett köp av två och B skriver 17 efter ett köp av tre. Slutvärdet blir 17 i stället för korrekta 15.</desc>
  <style>.h{font:700 24px Arial,sans-serif;fill:#173f5f}.lane{font:700 18px Arial,sans-serif;fill:#173f5f}.t{font:16px Arial,sans-serif;fill:#243447}.bad{font:700 18px Arial,sans-serif;fill:#9b2c2c}.s{font:14px Arial,sans-serif;fill:#52606d}.box{fill:#fff;stroke:#9fb3c8;stroke-width:2}.accent{fill:#e7f5f3;stroke:#116466;stroke-width:2}.warn{fill:#fde8e8;stroke:#c53030;stroke-width:2}.line{stroke:#9fb3c8;stroke-width:3;fill:none}</style>
  <rect width="1040" height="570" rx="24" fill="#f5f8fb"/>
  <text x="48" y="54" class="h">Två korrekta beräkningar kan ge ett felaktigt slutvärde</text>
  <text x="310" y="103" class="lane" text-anchor="middle">Transaktion A · säljer 2</text><text x="730" y="103" class="lane" text-anchor="middle">Transaktion B · säljer 3</text>
  <path d="M310 125v340M730 125v340" class="line"/>
  <rect x="178" y="145" width="264" height="68" rx="13" class="accent"/><text x="310" y="186" class="t" text-anchor="middle">läser UnitsInStock = 20</text>
  <rect x="598" y="230" width="264" height="68" rx="13" class="accent"/><text x="730" y="271" class="t" text-anchor="middle">läser UnitsInStock = 20</text>
  <rect x="178" y="315" width="264" height="68" rx="13" class="box"/><text x="310" y="356" class="t" text-anchor="middle">skriver 20 − 2 = 18</text>
  <rect x="598" y="400" width="264" height="68" rx="13" class="warn"/><text x="730" y="441" class="bad" text-anchor="middle">skriver 20 − 3 = 17</text>
  <rect x="360" y="496" width="320" height="48" rx="12" class="warn"/><text x="520" y="527" class="bad" text-anchor="middle">slutvärde 17 · borde vara 15</text>
  <text x="520" y="475" class="s" text-anchor="middle">B skriver från ett gammalt läsvärde och ersätter därmed A:s förändring.</text>
</svg>
