<svg xmlns="http://www.w3.org/2000/svg" width="900" height="495" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">Två olika produkter kan ligga lika nära önskemålet</title><desc id="desc">Önskemålet är punkten 3,4. Produkt 501 ligger på 2,4 och 503 på 3,3, vardera ett steg bort. Produkt 502 ligger på 1,5 och är längre bort med geometriskt avstånd.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#146c72" stroke-width="1.6" /></marker></defs><rect width="900" height="495" rx="12" fill="#f5f8fb" /><text x="28" y="40" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#173b50">Två olika produkter kan ligga lika nära önskemålet</text><path d="M85 400 H495" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M85 400 V70" fill="none" stroke="#146c72" stroke-width="2.5" marker-end="url(#arrow)" /><text x="145" y="427" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">1</text><text x="66" y="346" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#173b50">1</text><text x="205" y="427" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">2</text><text x="66" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#173b50">2</text><text x="265" y="427" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">3</text><text x="66" y="226" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#173b50">3</text><text x="325" y="427" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">4</text><text x="66" y="166" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#173b50">4</text><text x="385" y="427" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#173b50">5</text><text x="66" y="106" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="end" fill="#173b50">5</text><text x="370" y="463" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">Syrlighet</text><text x="28" y="64" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Fyllighet</text><circle cx="205" cy="160" r="8" fill="#146c72" /><text x="198" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">501</text><circle cx="145" cy="100" r="8" fill="#146c72" /><text x="160" y="105" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">502</text><circle cx="265" cy="220" r="8" fill="#146c72" /><text x="280" y="225" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#173b50">503</text><rect x="257" y="152" width="16" height="16" fill="#a34c16" /><path d="M213 160 H252" fill="none" stroke="#146c72" stroke-width="2.5" stroke-dasharray="7 5" /><path d="M265 172 V209" fill="none" stroke="#146c72" stroke-width="2.5" stroke-dasharray="7 5" /><rect x="530" y="100" width="340" height="151" rx="8" fill="#e7f5f3" stroke="#7897a8" stroke-width="1.5" /><text x="546" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#173b50">Önskemål: (3, 4)</text><text x="546" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">501: ett steg bort</text><text x="546" y="195" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">503: ett steg bort</text><text x="546" y="224" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#173b50">502: längre bort</text><text x="530" y="305" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Lika vikt för dimensionerna.</text><text x="530" y="342" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">Handgjorda exempelvärden,</text><text x="530" y="371" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">inte modellskapade</text><text x="530" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#173b50">textegenskaper.</text></svg>