<meta name="color-scheme" content="light dark">

<link
  id="databaser-dark-theme"
  rel="stylesheet"
  href="{{ '/assets/css/just-the-docs-databaser-dark.css' | relative_url }}"
  media="(prefers-color-scheme: dark)">

<script>
  (function () {
    var preference = "system";
    try {
      preference = window.localStorage.getItem("databaser-theme") || "system";
    } catch (error) {
      preference = "system";
    }

    if (preference !== "light" && preference !== "dark") {
      preference = "system";
    }

    var darkTheme = document.getElementById("databaser-dark-theme");
    if (preference === "dark") {
      darkTheme.media = "all";
    } else if (preference === "light") {
      darkTheme.media = "not all";
    }

    var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var resolved = preference === "system" ? (systemDark ? "dark" : "light") : preference;
    document.documentElement.dataset.databaserTheme = resolved;
    document.documentElement.style.colorScheme = resolved;
  }());
</script>

<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
